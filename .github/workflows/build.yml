name: build

on:
  push:
    branches: [main, v3-dev]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  test:
    name: 静态分析 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --reporter expanded

  server:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: 构建镜像（不推送）
        run: docker build -t kadian/llm-proxy:ci .

  android:
    name: Android APK / AAB
    runs-on: ubuntu-latest
    needs: test
    # secrets 不能直接写在 if 里（GitHub 会在解析阶段拒绝整个 workflow），
    # 先经 job 级 env 转一手，step 再用 env 判断。
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: 还原签名材料
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/kadian-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore/kadian-release.jks
          EOF

      - name: 构建 APK
        run: flutter build apk --release --build-name $(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)

      - name: 构建 AAB
        run: flutter build appbundle --release

      - name: 收集产物与校验和
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          cp build/app/outputs/bundle/release/app-release.aab dist/ 2>/dev/null || true
          cd dist && sha256sum * > checksums-sha256.txt && cat checksums-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    name: Windows EXE / MSIX
    # 固定 windows-2022：它带的是 Visual Studio 2022（主版本 17）。
    # Flutter 3.24.5 的 visual_studio.dart 只会映射
    #   17 => 'Visual Studio 17 2022'，其余一律 'Visual Studio 16 2019'
    # windows-latest 已换成 VS 2026（主版本 18），会命中默认分支拿到 2019
    # 生成器，CMake 直接报 "could not find any instance of Visual Studio"。
    # 换 Flutter 3.50 能修生成器，但 3.27+ 把 CardTheme 改成了 CardThemeData，
    # 需要改代码。在统一升级之前，先用带 VS 2022 的 runner 绕过。
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: 构建 Windows release
        shell: pwsh
        run: |
          # 失败时把日志尾部写进 annotation，便于在没有仓库权限的情况下诊断
          $log = "windows-build.log"
          flutter build windows --release 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content $log -Tail 15) -join ' >> '
            $tail = $tail -replace '\r?\n', ' '
            $tail = $tail -replace '%', '%25'
            Write-Output "::error title=Windows build failed::$tail"
            exit 1
          }

      - name: 打 MSIX（未配置证书时先生成未签名包）
        run: dart run msix:create

      - name: 免安装目录 + 校验和
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/kadian-windows-x64.zip" -Force
          Get-ChildItem "build/windows/x64/runner/Release/*.msix" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ }
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/checksums-sha256.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  content_pack:
    name: 内容包 ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build_content_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: content-pack
          path: dist/content_pack/*.zip
