name: build

on:
  push:
    branches: [main, v3-dev]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  test:
    name: 静态分析 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --reporter expanded

  server:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: 构建镜像（不推送）
        run: docker build -t kadian/llm-proxy:ci .

  android:
    name: Android APK / AAB
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: 还原签名材料
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/kadian-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore/kadian-release.jks
          EOF

      - name: 构建 APK
        run: flutter build apk --release --build-name $(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)

      - name: 构建 AAB
        run: flutter build appbundle --release

      - name: 收集产物与校验和
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          cp build/app/outputs/bundle/release/app-release.aab dist/ 2>/dev/null || true
          cd dist && sha256sum * > checksums-sha256.txt && cat checksums-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    name: Windows EXE / MSIX
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: 构建 Windows release
        run: flutter build windows --release

      - name: 打 MSIX（未配置证书时先生成未签名包）
        run: dart run msix:create

      - name: 免安装目录 + 校验和
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/kadian-windows-x64.zip" -Force
          Get-ChildItem "build/windows/x64/runner/Release/*.msix" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist/ }
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/checksums-sha256.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  content_pack:
    name: 内容包 ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build_content_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: content-pack
          path: dist/content_pack/*.zip
